# SHARED FILE: owned by ModTemplate and copied in by `make sync`; never edit it in a mod repo.
#
# Pushing a vX.Y.Z tag (what `make release` does) publishes that version:
# check, test, build the zip from the tag, create the GitHub release, and upload to
# Nexus when release.json has a nexusModId (needs the NEXUSMODS_API_KEY secret).
# Run it by hand on an existing tag to retry; untick "nexus" to skip the upload.
# Set the repository variable SKIP_LUA_TESTS=true to skip Lua tests on every run
# (Ubuntu outages); the check, Python tests and packaging always run.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true
      nexus:
        description: "Upload to Nexus Mods"
        type: boolean
        default: true
      skip_lua_tests:
        description: "Skip the Lua tests (only when LuaJIT can't be installed; run make test locally first)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SKIP_LUA_TESTS: ${{ (inputs.skip_lua_tests || vars.SKIP_LUA_TESTS == 'true') && '1' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      # apt first; when Ubuntu's mirrors are down, build LuaJIT from GitHub instead.
      - name: Install LuaJIT
        if: hashFiles('tests/*_test.lua') != '' && env.SKIP_LUA_TESTS != '1'
        run: |
          if timeout 120 sh -c 'sudo apt-get update -qq -o Acquire::Retries=2 && sudo apt-get install -y -qq luajit'; then
            exit 0
          fi
          echo "::warning::apt failed; building LuaJIT from source"
          git clone -q --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit"
          make -s -C "$RUNNER_TEMP/luajit" -j"$(nproc)"
          sudo make -s -C "$RUNNER_TEMP/luajit" install
          command -v luajit || sudo ln -sf "$(ls /usr/local/bin/luajit-2.1* | head -1)" /usr/local/bin/luajit
          luajit -v

      - name: Check, test, package
        run: |
          python3 tools/modtool.py check --ci
          make test
          make package

      - name: Release facts
        id: meta
        run: python3 tools/modtool.py ci-meta

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          ZIP: ${{ steps.meta.outputs.zip }}
          TITLE: ${{ steps.meta.outputs.title }} ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" \
              --title "$TITLE" --notes-file dist/notes.md --verify-tag
          fi

      - name: Resolve Nexus IDs
        id: nexus
        if: steps.meta.outputs.nexus_mod_id != '' && (github.event_name == 'push' || inputs.nexus)
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: python3 tools/modtool.py nexus-ids

      - name: Upload to Nexus Mods
        if: steps.nexus.outcome == 'success'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ steps.nexus.outputs.mod_id }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          filename: dist/${{ steps.meta.outputs.zip }}
          version: ${{ steps.meta.outputs.version }}
          display_name: ${{ steps.meta.outputs.title }}
          primary_mod_manager_download: true
          update_mod_version: true
          changelog: ${{ steps.meta.outputs.nexus_changelog }}
